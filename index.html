<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NLC Performance Breathing</title>
    
    <!-- React & Babel (Pinned version to prevent dynamic import compilation errors) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#FF851B',
                        'brand-darkorange': '#D35400',
                        'tactical-black': '#0a0e0c',
                        'panel-bg': '#121c16',
                        'panel-border': '#23362a',
                        'text-gray': '#5c7a65'
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Oswald:wght@400;600;700&family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            background-color: #0a0e0c;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents all scrolling */
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* Custom Animations */
        @keyframes pulse-orange {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 133, 27, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 133, 27, 0); }
        }
        .animate-pulse-orange { animation: pulse-orange 2s infinite; }

        @keyframes fade-in {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }

        .btn-tactical {
            background: rgba(18, 28, 22, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(35, 54, 42, 0.8);
            color: #5c7a65;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }
        .btn-tactical:active { transform: scale(0.98); }
        .btn-tactical:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        .btn-tactical.selected {
            background: linear-gradient(to right, #FF851B, #D35400);
            color: black;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 133, 27, 0.4);
            border: none;
        }

        .text-gradient-orange {
            background: linear-gradient(to bottom, #FFDEB3 0%, #FF851B 40%, #D35400 75%, #4A1500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-panel {
            background: rgba(18, 28, 22, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(35, 54, 42, 0.8);
        }

        /* Breathing Circle Animation Classes */
        .breath-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid #23362a;
            background: radial-gradient(circle, rgba(255,133,27,0.2) 0%, rgba(10,14,12,0) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 133, 27, 0.05);
            margin: 0 auto;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100%; } }
    </style>
</head>
<body class="bg-tactical-black">
    <div id="root" class="h-screen w-full relative"></div>

    <script type="text/babel" data-type="module">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */
        
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ZEN AUDIO & VOICE ENGINE ---
        const AudioEngine = {
            ctx: null,
            voiceEnabled: true,
            init: () => {
                if (!AudioEngine.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    AudioEngine.ctx = new AudioContext();
                }
                if ('speechSynthesis' in window) {
                    // Touch to initialize speech synthesis
                    window.speechSynthesis.getVoices();
                }
            },
            setVoiceEnabled: (enabled) => {
                AudioEngine.voiceEnabled = enabled;
            },
            playVoice: (text) => {
                if (!AudioEngine.voiceEnabled || !('speechSynthesis' in window)) return;
                
                window.speechSynthesis.cancel(); // Cancel queue
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; // Calming, slightly slower pace
                utterance.pitch = 0.95;
                window.speechSynthesis.speak(utterance);
            },
            playBell: () => {
                if (!AudioEngine.ctx) return;
                const now = AudioEngine.ctx.currentTime;
                
                // Layer 1: Deep Fundamental Tone
                const osc1 = AudioEngine.ctx.createOscillator();
                const gain1 = AudioEngine.ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(250, now); 
                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(0.2, now + 0.05); // Lowered volume
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 3);
                
                // Layer 2: Softer Metallic Harmonic Over-tone
                const osc2 = AudioEngine.ctx.createOscillator();
                const gain2 = AudioEngine.ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(650, now); 
                gain2.gain.setValueAtTime(0, now);
                gain2.gain.linearRampToValueAtTime(0.05, now + 0.05); // Lowered volume
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 2);
                
                osc1.connect(gain1);
                gain1.connect(AudioEngine.ctx.destination);
                
                osc2.connect(gain2);
                gain2.connect(AudioEngine.ctx.destination);
                
                osc1.start(now);
                osc1.stop(now + 3);
                
                osc2.start(now);
                osc2.stop(now + 2);
            }
        };

        // --- PROTOCOLS DEFINITION ---
        const PROTOCOLS = {
            BOX: {
                name: 'Box Breathing',
                shortName: 'BOX',
                desc: 'Balance',
                sequence: [
                    { name: 'INHALE', multiplier: 1 },
                    { name: 'HOLD', multiplier: 1 },
                    { name: 'EXHALE', multiplier: 1 },
                    { name: 'HOLD', multiplier: 1 }
                ]
            },
            P142: {
                name: '1:4:2 Protocol',
                shortName: '1:4:2',
                desc: 'Tolerance',
                sequence: [
                    { name: 'INHALE', multiplier: 1 },
                    { name: 'HOLD', multiplier: 4 },
                    { name: 'EXHALE', multiplier: 2 }
                ]
            },
            CADENCE: {
                name: 'Cadence 1:2',
                shortName: 'CADENCE',
                desc: 'Down-Reg',
                sequence: [
                    { name: 'INHALE', multiplier: 1 },
                    { name: 'EXHALE', multiplier: 2 }
                ]
            }
        };

        // --- HEADER COMPONENT ---
        const Header = () => (
            <header className="p-4 z-10 relative flex flex-col items-center justify-center border-b border-panel-border bg-tactical-black/50 backdrop-blur-md">
                <div className="flex items-center space-x-3">
                    <img 
                        src="nlcpWHITE.jpg" 
                        alt="NLC Logo" 
                        className="w-10 h-10 md:w-12 md:h-12 rounded-full border border-brand-orange shadow-[0_0_10px_rgba(255,133,27,0.3)] object-cover bg-white"
                        onError={(e) => {
                            e.target.onerror = null;
                            e.target.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%23FF851B"><circle cx="50" cy="50" r="45" fill="%230a0e0c" stroke="%23FF851B" stroke-width="4"/><text x="50" y="55" font-size="20" font-weight="bold" text-anchor="middle" fill="%23fff">NLC</text></svg>';
                        }}
                    />
                    <div>
                        <h1 className="text-xl md:text-2xl font-black uppercase text-white drop-shadow-md leading-none tracking-tight">
                            NLC<span className="text-gradient-orange ml-1">BREATHE</span>
                        </h1>
                        <p className="text-[10px] text-text-gray font-bold tracking-[0.15em] mt-1 uppercase">Performance Protocol</p>
                    </div>
                </div>
            </header>
        );

        // --- FOOTER COMPONENT ---
        const Footer = () => (
            <div className="w-full text-center pb-4 pt-4 mt-auto border-t border-panel-border bg-tactical-black/80 backdrop-blur-md">
                <span className="text-[10px] md:text-xs font-black tracking-[0.35em] text-gradient-orange uppercase font-mono">
                    Adapt. Recover. Master.
                </span>
            </div>
        );

        // --- SETUP DASHBOARD ---
        const Setup = ({ onLaunch }) => {
            const [co2Score, setCo2Score] = useState(40);
            const [protocol, setProtocol] = useState('BOX');
            const [durationMins, setDurationMins] = useState(5); 
            const [useVoice, setUseVoice] = useState(true);

            // Calculate Base Unit (X) based on exact Shift Adapt tiers
            const calculateBase = (score) => {
                if (score > 80) return 8;
                if (score >= 60) return 7;
                if (score >= 40) return 6;
                if (score >= 20) return 5;
                return 3; 
            };
            const baseUnit = calculateBase(co2Score);

            const handleStart = () => {
                AudioEngine.init(); 
                AudioEngine.setVoiceEnabled(useVoice);
                
                const protocolData = PROTOCOLS[protocol];
                
                // MATH: Calculate exact cycles needed to hit the target minutes
                const cycleMultiplierSum = protocolData.sequence.reduce((acc, step) => acc + step.multiplier, 0);
                const cycleDurationSecs = cycleMultiplierSum * baseUnit;
                
                const targetTotalSecs = durationMins * 60;
                const targetCycles = Math.ceil(targetTotalSecs / cycleDurationSecs); // Always finish a full cycle
                const exactDurationSecs = targetCycles * cycleDurationSecs;

                onLaunch({
                    co2Score,
                    baseUnit,
                    protocolData,
                    targetCycles,
                    exactDurationSecs,
                    durationMins
                });
            };

            return (
                <div className="h-full flex flex-col bg-[radial-gradient(circle_at_center,_#121c16_0%,_#0a0e0c_100%)]">
                    <Header />
                    <div className="flex-1 flex flex-col p-4 max-w-lg w-full mx-auto animate-fade-in overflow-y-auto pb-6">
                        
                        <div className="flex-1 flex flex-col gap-6 py-2 mt-4">
                            
                            {/* 1. CO2 Input */}
                            <div className="w-full glass-panel p-5 rounded-3xl shadow-lg relative overflow-hidden">
                                <div className="absolute -top-10 -right-10 w-32 h-32 bg-brand-orange rounded-full mix-blend-screen filter blur-[60px] opacity-10 pointer-events-none"></div>
                                <label className="text-[11px] text-brand-orange uppercase mb-3 block font-bold tracking-widest flex items-center">
                                    <i className="fas fa-stopwatch mr-2 text-sm"></i> 1. CO2 Tolerance (Secs)
                                </label>
                                <div className="flex items-center justify-between bg-tactical-black p-2 border border-panel-border rounded-xl">
                                    <button 
                                        onClick={() => setCo2Score(Math.max(10, co2Score - 5))}
                                        className="w-12 h-12 flex items-center justify-center text-2xl text-text-gray bg-panel-bg rounded-lg active:bg-brand-orange/20 hover:text-white transition-colors"
                                    >-</button>
                                    <div className="text-center flex-1">
                                        <div className="text-4xl font-mono font-black text-white leading-none">{co2Score}</div>
                                        <div className="text-[10px] text-text-gray uppercase tracking-widest mt-1 font-bold">Base Breath: <span className="text-brand-orange">{baseUnit}s</span></div>
                                    </div>
                                    <button 
                                        onClick={() => setCo2Score(Math.min(120, co2Score + 5))}
                                        className="w-12 h-12 flex items-center justify-center text-2xl text-text-gray bg-panel-bg rounded-lg active:bg-brand-orange/20 hover:text-white transition-colors"
                                    >+</button>
                                </div>
                            </div>

                            {/* 2. Protocol Selection */}
                            <div className="w-full">
                                <label className="text-[11px] text-text-gray uppercase mb-2 block font-bold tracking-widest pl-2">2. Architecture</label>
                                <div className="glass-panel p-1.5 rounded-2xl flex space-x-1 shadow-lg">
                                    {Object.entries(PROTOCOLS).map(([key, data]) => (
                                        <button 
                                            key={key}
                                            onClick={() => setProtocol(key)}
                                            className={`flex-1 py-3 px-1 rounded-xl font-bold text-xs md:text-sm transition-all duration-300 uppercase tracking-wider flex flex-col items-center justify-center
                                                ${protocol === key ? 'bg-gradient-to-r from-brand-orange to-brand-darkorange text-black shadow-[0_0_20px_rgba(255,133,27,0.4)]' : 'text-text-gray hover:text-white hover:bg-white/5'}`}
                                        >
                                            <span>{data.shortName}</span>
                                            <span className={`text-[8px] mt-0.5 tracking-widest ${protocol === key ? 'text-black/70' : 'text-text-gray/50'}`}>{data.desc}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* 3. Duration Selection */}
                            <div className="w-full">
                                <label className="text-[11px] text-text-gray uppercase mb-2 block font-bold tracking-widest pl-2">3. Target Duration</label>
                                <div className="glass-panel p-1.5 rounded-2xl flex space-x-1 shadow-lg">
                                    {[3, 5, 10].map(mins => (
                                        <button 
                                            key={mins}
                                            onClick={() => setDurationMins(mins)}
                                            className={`flex-1 py-3 rounded-xl font-mono font-bold text-sm md:text-base transition-all duration-300 flex items-center justify-center gap-1
                                                ${durationMins === mins ? 'bg-gradient-to-r from-brand-orange to-brand-darkorange text-black shadow-[0_0_20px_rgba(255,133,27,0.4)]' : 'text-text-gray hover:text-white hover:bg-white/5'}`}
                                        >
                                            {mins} <span className={`text-[10px] ${durationMins === mins ? 'text-black/70' : 'text-text-gray/50'}`}>MIN</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* 4. Audio Preferences */}
                            <div className="w-full">
                                <label className="text-[11px] text-text-gray uppercase mb-2 block font-bold tracking-widest pl-2">4. Audio Cues</label>
                                <div className="glass-panel p-1.5 rounded-2xl flex space-x-1 shadow-lg">
                                    <button 
                                        onClick={() => setUseVoice(true)}
                                        className={`flex-1 py-3 rounded-xl font-bold text-xs tracking-wider transition-all duration-300
                                            ${useVoice ? 'bg-gradient-to-r from-brand-orange to-brand-darkorange text-black shadow-[0_0_20px_rgba(255,133,27,0.4)]' : 'text-text-gray hover:text-white hover:bg-white/5'}`}
                                    >
                                        VOICE + BELLS
                                    </button>
                                    <button 
                                        onClick={() => setUseVoice(false)}
                                        className={`flex-1 py-3 rounded-xl font-bold text-xs tracking-wider transition-all duration-300
                                            ${!useVoice ? 'bg-gradient-to-r from-brand-orange to-brand-darkorange text-black shadow-[0_0_20px_rgba(255,133,27,0.4)]' : 'text-text-gray hover:text-white hover:bg-white/5'}`}
                                    >
                                        BELLS ONLY
                                    </button>
                                </div>
                            </div>

                        </div>

                        <div className="mt-8 mb-2">
                            <button 
                                onClick={handleStart}
                                className="w-full py-5 bg-zinc-100 text-black font-black text-lg md:text-xl uppercase tracking-[0.15em] rounded-2xl hover:bg-white active:scale-95 transition-all duration-300 shadow-[0_0_20px_rgba(255,255,255,0.15)] flex items-center justify-center gap-3"
                            >
                                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>
                                Initiate Protocol
                            </button>
                        </div>
                    </div>
                    <Footer />
                </div>
            );
        };

        // --- ACTIVE SESSION ---
        const ActiveSession = ({ config, onFinish, onCancel }) => {
            const { baseUnit, protocolData, targetCycles, exactDurationSecs } = config;
            
            const [currentCycle, setCurrentCycle] = useState(1);
            const [totalTimeLeft, setTotalTimeLeft] = useState(exactDurationSecs); 
            const [stepIndex, setStepIndex] = useState(0);
            const [stepTimeLeft, setStepTimeLeft] = useState(protocolData.sequence[0].multiplier * baseUnit);
            const [isActive, setIsActive] = useState(false);
            
            const [circleScale, setCircleScale] = useState(1);
            const [transitionSecs, setTransitionSecs] = useState(0);
            
            // "Hold to cancel" state
            const [abortProgress, setAbortProgress] = useState(0);

            const intervalRef = useRef(null);
            const abortIntervalRef = useRef(null);
            const wakeLockRef = useRef(null);

            // Screen Wake Lock API to prevent phone sleeping
            const requestWakeLock = async () => {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.error('Wake Lock error:', err.message);
                }
            };

            const releaseWakeLock = async () => {
                if (wakeLockRef.current !== null) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                }
            };

            useEffect(() => {
                requestWakeLock();
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') requestWakeLock();
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                setTimeout(() => {
                    setIsActive(true);
                    triggerPhaseCue(0);
                }, 500); 

                return () => {
                    clearInterval(intervalRef.current);
                    releaseWakeLock();
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, []);

            useEffect(() => {
                if (!isActive) return;

                intervalRef.current = setInterval(() => {
                    setTotalTimeLeft(prev => {
                        if (prev <= 1) return 0;
                        return prev - 1;
                    });

                    setStepTimeLeft(prevStepTime => {
                        if (prevStepTime <= 1) {
                            
                            let nextIdx = stepIndex + 1;
                            let nextCycle = currentCycle;

                            // If we finished all steps in the sequence, increment the cycle
                            if (nextIdx >= protocolData.sequence.length) {
                                nextIdx = 0;
                                nextCycle++;
                            }

                            // If we have completed the total target cycles, finish session
                            if (nextCycle > targetCycles) {
                                setIsActive(false);
                                setTimeout(() => onFinish(), 0);
                                return 0;
                            }

                            // Otherwise, move to next step
                            setStepIndex(nextIdx);
                            if (nextCycle !== currentCycle) setCurrentCycle(nextCycle);

                            const nextDuration = protocolData.sequence[nextIdx].multiplier * baseUnit;
                            triggerPhaseCue(nextIdx, nextDuration);
                            return nextDuration;
                        }
                        return prevStepTime - 1;
                    });
                }, 1000);

                return () => clearInterval(intervalRef.current);
            }, [isActive, stepIndex, currentCycle]);

            const triggerPhaseCue = (index, nextDuration) => {
                const step = protocolData.sequence[index];
                const duration = nextDuration || (step.multiplier * baseUnit);
                
                AudioEngine.playBell();
                AudioEngine.playVoice(step.name);

                if (step.name === 'INHALE') {
                    setTransitionSecs(duration);
                    setCircleScale(2.2); 
                } else if (step.name === 'EXHALE') {
                    setTransitionSecs(duration);
                    setCircleScale(1); 
                } else {
                    setTransitionSecs(0); 
                }
            };

            // Hold-to-abort logic
            const handleAbortStart = useCallback(() => {
                abortIntervalRef.current = setInterval(() => {
                    setAbortProgress(prev => {
                        if (prev >= 100) {
                            clearInterval(abortIntervalRef.current);
                            onCancel();
                            return 100;
                        }
                        return prev + 5; // Takes roughly 1 second to reach 100
                    });
                }, 50);
            }, [onCancel]);

            const handleAbortEnd = useCallback(() => {
                clearInterval(abortIntervalRef.current);
                setAbortProgress(0);
            }, []);

            const currentStep = protocolData.sequence[stepIndex];
            const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;

            return (
                <div className="h-full flex flex-col bg-[radial-gradient(circle_at_center,_#23362a_0%,_#0a0e0c_100%)] animate-fade-in relative">
                    <div className="scanline"></div>
                    <Header />
                    
                    <div className="flex-1 flex flex-col p-4 max-w-lg w-full mx-auto relative">
                        
                        {/* Header Info */}
                        <div className="flex justify-between items-end border-b border-panel-border pb-4 mt-2">
                            <div>
                                <div className="text-[10px] text-text-gray uppercase tracking-widest font-bold">Architecture</div>
                                <div className="text-lg font-black text-white leading-tight uppercase tracking-tight">{protocolData.name}</div>
                            </div>
                            <div className="text-right">
                                <div className="text-[10px] text-brand-orange uppercase tracking-widest font-bold">Cycle Progress</div>
                                <div className="text-lg font-mono font-black text-white leading-tight">
                                    {currentCycle} <span className="text-sm text-text-gray font-sans">/ {targetCycles}</span>
                                </div>
                            </div>
                        </div>

                        {/* HUD / Visualizer */}
                        <div className="flex-1 flex flex-col items-center justify-center relative my-8">
                            
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <div 
                                    className="breath-circle"
                                    style={{
                                        transform: `scale(${circleScale})`,
                                        transition: `transform ${transitionSecs}s linear`
                                    }}
                                ></div>
                            </div>

                            <div className="z-10 text-center glass-panel p-8 rounded-full border-brand-orange/30 shadow-[0_0_30px_rgba(255,133,27,0.1)] w-64 h-64 flex flex-col items-center justify-center">
                                <div className="text-4xl md:text-5xl font-black uppercase text-white tracking-widest mb-2 font-oswald text-shadow">
                                    {currentStep.name}
                                </div>
                                <div className="text-6xl md:text-7xl font-mono font-black text-transparent bg-clip-text bg-gradient-to-b from-[#FFDEB3] via-[#FF851B] to-[#D35400] drop-shadow-[0_4px_15px_rgba(0,0,0,0.8)] tabular-nums">
                                    {stepTimeLeft}
                                </div>
                            </div>
                            
                            {/* Overall Session Progress */}
                            <div className="absolute bottom-4 z-10 w-full flex flex-col items-center">
                                <div className="text-[10px] text-text-gray uppercase tracking-widest font-bold mb-2">Session Remaining: <span className="text-white font-mono">{formatTime(totalTimeLeft)}</span></div>
                                <div className="w-4/5 max-w-xs h-1.5 bg-panel-bg rounded-full overflow-hidden border border-panel-border">
                                    <div 
                                        className="h-full bg-brand-orange transition-all duration-1000 ease-linear shadow-[0_0_10px_rgba(255,133,27,0.6)]"
                                        style={{ width: `${((exactDurationSecs - totalTimeLeft) / exactDurationSecs) * 100}%` }}
                                    ></div>
                                </div>
                            </div>
                        </div>

                        {/* Footer Actions / Hold to Abort */}
                        <div className="mt-auto pt-2 flex flex-col items-center z-10 mb-4">
                            <button 
                                onMouseDown={handleAbortStart}
                                onMouseUp={handleAbortEnd}
                                onMouseLeave={handleAbortEnd}
                                onTouchStart={handleAbortStart}
                                onTouchEnd={handleAbortEnd}
                                className="relative overflow-hidden w-full max-w-[200px] py-4 bg-red-950/40 border border-red-900/50 text-red-500 hover:bg-red-900 hover:text-white font-bold text-xs tracking-widest uppercase rounded-xl transition-all flex items-center justify-center select-none"
                            >
                                <div 
                                    className="absolute inset-0 bg-red-600 origin-left transition-transform duration-75"
                                    style={{ transform: `scaleX(${abortProgress / 100})` }}
                                ></div>
                                <span className="relative z-10 flex items-center gap-2">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    {abortProgress > 0 ? 'HOLD TO ABORT...' : 'ABORT PROTOCOL'}
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUMMARY ---
        const Summary = ({ config, onReset }) => {
            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                const secs = s % 60;
                return m > 0 ? `${m}m ${secs}s` : `${secs}s`;
            };

            return (
                <div className="h-full flex flex-col bg-[radial-gradient(circle_at_center,_#121c16_0%,_#0a0e0c_100%)] animate-fade-in">
                    <Header />
                    <div className="flex-1 flex flex-col p-4 max-w-lg w-full mx-auto justify-center text-center relative">
                        
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-brand-orange rounded-full mix-blend-screen filter blur-[100px] opacity-10 pointer-events-none"></div>

                        <h1 className="text-3xl md:text-4xl font-black text-white uppercase tracking-tighter mb-2">PROTOCOL COMPLETE</h1>
                        <div className="w-16 h-1 bg-brand-orange mx-auto mb-10 shadow-[0_0_10px_rgba(255,133,27,0.5)]"></div>
                        
                        <div className="glass-panel p-8 rounded-3xl flex flex-col justify-center mb-10 shadow-2xl border-brand-orange/20 relative overflow-hidden">
                            <div className="text-[10px] text-brand-orange uppercase tracking-[0.2em] font-bold mb-4">Session Analytics</div>
                            
                            <div className="text-5xl font-mono font-black text-white mb-2 tracking-tighter drop-shadow-md">
                                {formatTime(config.exactDurationSecs)}
                            </div>
                            
                            <div className="text-text-gray text-sm font-bold uppercase tracking-widest mb-6 pb-6 border-b border-panel-border">{config.protocolData.name}</div>
                            
                            <div className="flex justify-between items-center text-xs font-mono font-bold">
                                <div className="flex flex-col items-start">
                                    <span className="text-text-gray uppercase tracking-widest text-[9px] mb-1">Base Unit</span>
                                    <span className="text-white text-lg">{config.baseUnit}s</span>
                                </div>
                                <div className="flex flex-col items-end">
                                    <span className="text-text-gray uppercase tracking-widest text-[9px] mb-1">Completed</span>
                                    <span className="text-white text-lg">{config.targetCycles} <span className="text-text-gray text-xs">CYCLES</span></span>
                                </div>
                            </div>
                        </div>
                        
                        <div className="mt-auto flex flex-col items-center pb-8">
                            <button 
                                onClick={onReset} 
                                className="w-full py-4 glass-panel text-white font-bold text-sm md:text-base tracking-widest uppercase rounded-xl hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center gap-2 border-brand-orange/30"
                            >
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Return to Dashboard
                            </button>
                        </div>
                    </div>
                    <Footer />
                </div>
            );
        };

        // --- APP ROOT ---
        const App = () => {
            const [view, setView] = useState('SETUP'); 
            const [config, setConfig] = useState(null);

            const handleLaunch = (launchConfig) => {
                setConfig(launchConfig);
                setView('WORKOUT');
            };

            const handleFinish = () => setView('SUMMARY');

            const handleReset = () => {
                setConfig(null);
                setView('SETUP');
            };

            return (
                <>
                    {view === 'SETUP' && <Setup onLaunch={handleLaunch} />}
                    {view === 'WORKOUT' && <ActiveSession config={config} onFinish={handleFinish} onCancel={handleReset} />}
                    {view === 'SUMMARY' && <Summary config={config} onReset={handleReset} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
